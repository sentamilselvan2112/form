<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculater</title>
</head>
<link rel="stylesheet" href="style.css">
<body>

    <div class="calculator">

        <div class="welcome">
           <strong>Welcome to Calculator</strong>
        </div>

        <div class="display">

        </div>
        <div class="buttons">

            <button class="function">AC</button>

            <button class="function">←</button>

            <button class="function">%</button>

            <button class="operator">÷</button>

            <button>7</button>
            
            <button>8</button>

            <button>9</button>
            <button class="operator">×</button>

            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button class="operator">−</button>

            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button class="operator">+</button>

            <button>0</button>
            <button>00</button>
            <button>.</button>
            <button class="operator">=</button>

        </div>

    </div>
</body>
</html>
